name: Static source and CFG contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Combat catalog-to-writer contract
        run: python tools/audit_combat_contract.py

      - name: Active UI-to-CFG contract
        run: python tools/audit_ui_cfg_contract.py

      - name: Final 268-source CFG to actual BPatch writer route and factory-output audit
        run: python tools/audit_final_cfg_mapping.py --out audit/final-cfg-mapping

      - name: Reserved gear queue and direct medical consumables source audit
        run: python tools/audit_regular_stash_consumables.py

      - name: Cabin guaranteed Medkit source scope
        run: python tools/audit_cabin_medkit_stash.py

      - name: Protect blueprint and named-clue base stash actors across all tier writers
        run: python tools/audit_base_stash_protection.py

      - name: Stash content, gear and medical composition/source-count contract
        run: python tools/audit_stash_content_gear.py

      - name: Whole-project active source consistency
        run: python tools/audit_project_consistency.py

      - name: Build Difficulty activity rail contract
        run: python tools/audit_build_progress_contract.py

      - name: Portable publish folder inode and user-state preservation regression
        run: python tools/audit_publish_directory_contract.py

      - name: RC extreme-signal preset audit
        run: python tools/audit_rc_signal_preset.py

      - name: Regression - vanilla refkey source inheritance
        run: python tools/test_cfg_source_inheritance.py

      - name: A-Life original Director source gate entrypoint smoke
        run: |
          python -m py_compile tools/audit_alife_director_source.py
          python tools/audit_alife_director_source.py --help

      - name: Original consumable effects source auditor syntax and CLI
        run: |
          python -m py_compile tools/audit_consumable_effect_source.py
          python tools/audit_consumable_effect_source.py --help

      - name: Loot direct original source structure gate smoke
        run: |
          python -m py_compile tools/audit_loot_direct_source.py
          python tools/audit_loot_direct_source.py --help

      - name: Streaming World Loot decoded ZIP source checker syntax and CLI
        run: |
          python -m py_compile tools/audit_loot_world_source.py
          python tools/audit_loot_world_source.py --help

      - name: Original nested stash weapon mechanics and minimal source patch regression
        run: python tools/audit_world_weapon_nested_source.py

      - name: Pre-release runner and documented inventory smoke
        run: |
          python tools/pre_release.py list
          python tools/pre_release.py static --output audit/pre-release/ci-static

  linux-crossbuild-wpf-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Install .NET 10 for Linux-to-Windows cross-build
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Intentionally omit -p:EnableWindowsTargeting=true: the test project
      # must inherit this property from tests/Directory.Build.props.
      - name: Cross-build Windows WPF Loot special-generator contract
        run: dotnet build tests/LootSpecialGeneratorsContract/LootSpecialGeneratorsContract.csproj -c Release -r win-x64 --nologo

  combat-writer-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Install .NET 10 for WPF writer execution
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate and verify real Combat BPatch output
        shell: pwsh
        run: dotnet run --project tests/CombatPatchContract/CombatPatchContract.csproj -c Release -- --out audit/combat-patch-fixtures

      - name: Keep generated BPatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-patch-contract
          path: audit/combat-patch-fixtures
          if-no-files-found: ignore
          retention-days: 7
