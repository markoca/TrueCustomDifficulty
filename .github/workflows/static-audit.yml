name: Static source and CFG contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Combat catalog-to-writer contract
        run: python tools/audit_combat_contract.py

      - name: Active UI-to-CFG contract
        run: python tools/audit_ui_cfg_contract.py

      - name: Whole-project active source consistency
        run: python tools/audit_project_consistency.py

      - name: Pre-release runner and documented inventory smoke
        run: |
          python tools/pre_release.py list
          python tools/pre_release.py static --output audit/pre-release/ci-static

  combat-writer-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Install .NET 10 for WPF writer execution
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate and verify real Combat BPatch output
        shell: pwsh
        run: dotnet run --project tests/CombatPatchContract/CombatPatchContract.csproj -c Release -- --out audit/combat-patch-fixtures

      - name: Keep generated BPatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-patch-contract
          path: audit/combat-patch-fixtures
          if-no-files-found: ignore
          retention-days: 7

