name: Build standalone open-source Oodle decoder for local audits

on:
  push:
    paths:
      - '.github/workflows/mod-audit-build-ooz.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Build Linux decoder library from upstream GPL source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/oriath-net/gooz.git /tmp/gooz
          cd /tmp/gooz
          g++ -std=c++17 -O2 -msse4.1 -fPIC -shared kraken.cpp bitknit.cpp lzna.cpp -o /tmp/libooz.so
          file /tmp/libooz.so
          nm -D /tmp/libooz.so | grep Kraken_Decompress
      - uses: actions/upload-artifact@v4
        with:
          name: ooz-linux-amd64
          path: /tmp/libooz.so
          retention-days: 2
